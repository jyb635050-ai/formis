<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形制 Formis · 网页制图与建模</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="description" content="形制 Formis —— 浏览器里的制图与三维建模：尺寸驱动草图、拉伸切除圆角建模、工程图，导出 DXF / PDF / SVG / 3MF / STEP">
<script>
  // 首屏前定主题，避免闪一下
  (function () { try { var t = localStorage.getItem('glasscad.theme'); if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; var l = localStorage.getItem('glasscad.lang'); if (l === 'en') document.documentElement.lang = 'en'; } catch (e) { } })();
</script>
</head>
<body>
<div id="viewport" data-testid="viewport">
  <div id="sheetview" hidden></div>
</div>

<header id="topbar" class="glass" data-float="top">
  <div class="brand"><img class="logo" src="favicon.svg" alt=""><b data-i="app"></b><small data-i="tagline"></small></div>
  <div class="seg" role="tablist">
    <button data-testid="mode-2d" data-mode="2d" data-i="mode-2d"></button>
    <button data-testid="mode-3d" data-mode="3d" data-i="mode-3d"></button>
    <button data-testid="mode-sheet" data-mode="sheet" data-i="mode-sheet"></button>
  </div>
  <input id="pname" data-testid="project-name" data-user-content autocomplete="off" spellcheck="false">
  <div class="grp files">
    <button data-testid="save" class="ic" data-ti="save"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z M8 4v5h8V4 M8 20v-6h8v6"/></svg></button>
    <label class="ic filebtn" data-ti="open"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><input type="file" data-testid="open" accept=".json,application/json"></label>
    <button id="undo" class="ic" data-ti="undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5 M4 12h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button id="redo" class="ic" data-ti="redo"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5 M20 12H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <div class="grp exports">
    <button data-testid="export-dxf" data-ti="export-dxf">DXF</button>
    <button data-testid="export-svg" data-ti="export-svg">SVG</button>
    <button data-testid="export-pdf" data-ti="export-pdf">PDF</button>
    <button data-testid="export-3mf" data-ti="export-3mf">3MF</button>
    <button data-testid="export-step" data-ti="export-step">STEP</button>
  </div>
  <div class="grp right">
    <button data-testid="theme" class="ic" data-ti="theme"><svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button data-testid="lang" class="langbtn" data-i="lang"></button>
  </div>
</header>

<nav id="sketchbar" class="glass bar" data-float="left">
  <div class="cap" data-i="sketchTools"></div>
  <button data-testid="tool-select" data-tool="select" data-ti="tool-select"><svg viewBox="0 0 24 24"><path d="M6 3l12 9-6 1 3 7-2 1-3-7-4 4z"/></svg></button>
  <button data-testid="tool-line" data-tool="line" data-ti="tool-line"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/></svg></button>
  <button data-testid="tool-rect" data-tool="rect" data-ti="tool-rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
  <button data-testid="tool-circle" data-tool="circle" data-ti="tool-circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.2"/></svg></button>
  <button data-testid="tool-arc" data-tool="arc" data-ti="tool-arc"><svg viewBox="0 0 24 24"><path d="M4 18a10 10 0 0 1 16 0"/></svg></button>
  <button data-testid="tool-dim" data-tool="dim" data-ti="tool-dim"><svg viewBox="0 0 24 24"><path d="M4 8v10M20 8v10M4 13h16M7 10l-3 3 3 3M17 10l3 3-3 3"/></svg></button>
  <button data-testid="tool-text" data-tool="text" data-ti="tool-text"><svg viewBox="0 0 24 24"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></svg></button>
  <button id="dim-style-btn" data-ti="dimStyle"><svg viewBox="0 0 24 24"><path d="M4 8v10M20 8v10" /><path d="M4 13h16" stroke-dasharray="2.5 2"/><circle cx="18" cy="5" r="2"/></svg></button>
  <button id="dims-toggle" data-testid="dims-toggle" data-ti="dimsToggle"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.6"/><path class="slash" d="M4 20 20 4"/></svg></button>
  <button id="tool-construction" data-ti="tool-construction"><svg viewBox="0 0 24 24"><path d="M4 20 20 4" stroke-dasharray="3 3"/></svg></button>
  <div class="sep three"></div>
  <button data-testid="new-sketch" class="three" data-ti="new-sketch"><svg viewBox="0 0 24 24"><path d="M4 16 12 20l8-4-8-4z M12 4v8 M8 8h8"/></svg></button>
  <button data-testid="sketch-done" class="three" data-ti="sketch-done"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></button>
</nav>

<div id="dock" class="glass bar h" data-float="bottom">
  <div class="cap" data-i="featTools"></div>
  <button data-testid="feat-extrude" data-feat="extrude" data-ti="feat-extrude"><svg viewBox="0 0 24 24"><path d="M5 17h10v-8H5z M5 9l4-4h10v8l-4 4 M15 9l4-4"/></svg></button>
  <button data-testid="feat-cut" data-feat="cut" data-ti="feat-cut"><svg viewBox="0 0 24 24"><path d="M4 18h16V8H4z M9 8v6h6V8"/></svg></button>
  <button data-testid="feat-revolve" data-feat="revolve" data-ti="feat-revolve"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="2.5"/><path d="M5 7v10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V7"/></svg></button>
  <button data-testid="feat-fillet" data-feat="fillet" data-ti="feat-fillet"><svg viewBox="0 0 24 24"><path d="M5 19V11a6 6 0 0 1 6-6h8"/></svg></button>
  <button data-testid="feat-chamfer" data-feat="chamfer" data-ti="feat-chamfer"><svg viewBox="0 0 24 24"><path d="M5 19V10l5-5h9"/></svg></button>
  <button data-testid="feat-shell" data-feat="shell" data-ti="feat-shell"><svg viewBox="0 0 24 24"><path d="M4 7v12h16V7 M7 7v9h10V7"/></svg></button>
  <div class="sep"></div>
  <div class="cap" data-i="views"></div>
  <button data-testid="view-front" data-view="front" data-ti="view-front"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg></button>
  <button data-testid="view-top" data-view="top" data-ti="view-top"><svg viewBox="0 0 24 24"><path d="M4 9l8-4 8 4-8 4z"/></svg></button>
  <button data-testid="view-left" data-view="left" data-ti="view-left"><svg viewBox="0 0 24 24"><path d="M8 5l8 3v11l-8-3z"/></svg></button>
  <button data-testid="view-iso" data-view="iso" data-ti="view-iso"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z M12 12l8-4.5 M12 12v9 M12 12 4 7.5"/></svg></button>
  <button data-testid="view-normal" id="view-normal" data-ti="normalTo"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/><path d="M12 12v-9M9 6l3-3 3 3"/><circle cx="12" cy="12" r="1.6"/></svg></button>
  <button data-testid="view-fit" data-view="fit" data-ti="view-fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/></svg></button>
  <div class="sep"></div>
  <button data-testid="make-sheet" class="wide" data-ti="make-sheet"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M7 7h5v4H7z M14 7h3 M14 10h3 M7 15h10 M13 18h4"/></svg><span data-i="make-sheet"></span></button>
</div>

<aside id="tree" class="glass panel" data-float="right">
  <div class="ph"><span data-i="tree"></span></div>
  <div id="treelist"></div>
  <div id="info"></div>
</aside>

<section id="props" class="glass panel" data-float="left" hidden></section>

<div id="sheetbar" class="glass panel" data-float="left" hidden>
  <label><span data-i="sheetSize"></span>
    <select data-testid="sheet-size"><option value="A4">A4 (297×210)</option><option value="A3">A3 (420×297)</option></select></label>
  <label><span data-i="scale"></span>
    <select id="sheet-scale"><option value="auto" data-i="scaleAuto"></option><option value="10">10:1</option><option value="5">5:1</option><option value="2">2:1</option><option value="1">1:1</option><option value="0.5">1:2</option><option value="0.2">1:5</option><option value="0.1">1:10</option><option value="0.05">1:20</option><option value="0.02">1:50</option><option value="0.01">1:100</option></select></label>
  <label class="chk"><input type="checkbox" id="sheet-iso" checked> <span data-i="isoView"></span></label>
  <label class="chk"><input type="checkbox" id="sheet-names" checked> <span data-i="viewNames"></span></label>
  <div id="sheetinfo"></div>
</div>

<section id="dimstyle" class="glass panel" hidden>
  <h3 data-i="dimStyle"></h3>
  <label class="row"><span data-i="dsLine"></span><select id="ds-line"><option value="solid" data-i="dsSolid"></option><option value="dashed" data-i="dsDashed"></option><option value="dashdot" data-i="dsDashdot"></option></select></label>
  <label class="row"><span data-i="dsArrow"></span><select id="ds-arrow"><option value="arrow" data-i="dsArrowFill"></option><option value="open" data-i="dsArrowOpen"></option><option value="tick" data-i="dsTick"></option><option value="dot" data-i="dsDot"></option></select></label>
  <label class="row"><span data-i="dsColor"></span><input type="color" id="ds-color"><button id="ds-color-reset" class="mini-btn" data-i="dsDefault"></button></label>
  <label class="row"><span data-i="dsText"></span><input type="range" id="ds-text" min="9" max="22" step="1"><b id="ds-text-v"></b></label>
  <label class="row"><span data-i="dsShow"></span><input type="checkbox" id="ds-show" checked></label>
</section>
<div id="status"></div>
<div id="toast" hidden></div>
<div id="textbox" class="glass" hidden>
  <input id="tx-text" data-testid="text-input" autocomplete="off" data-ti="textContent">
  <div class="row"><span data-i="textSize"></span>
    <button class="mini" data-step="-1" data-ti="textSmaller">A−</button>
    <input id="tx-hr" type="range" min="1" max="100" step="0.5">
    <button class="mini" data-step="1" data-ti="textBigger">A+</button>
    <input id="tx-h" data-testid="text-size" class="num" inputmode="decimal" autocomplete="off"><span>mm</span></div>
  <div class="row"><span data-i="textAngle"></span>
    <button class="mini" data-rot="-15" data-ti="textRotCw">↻15°</button>
    <input id="tx-ar" type="range" min="-180" max="180" step="1">
    <button class="mini" data-rot="15" data-ti="textRotCcw">↺15°</button>
    <input id="tx-a" data-testid="text-angle" class="num" inputmode="decimal" autocomplete="off"><span>°</span></div>
  <div class="row"><span></span><button class="mini" data-rot="0">0°</button><button class="mini" data-rot="90">↺90°</button><button class="mini" data-rot="-90">↻90°</button><button class="mini" data-rot="180">180°</button></div>
  <div class="row end"><small data-i="textTip"></small><button id="tx-del" class="mini" data-i="del"></button><button id="tx-ok" class="primary" data-i="ok"></button></div>
</div>
<div id="dimbox" class="glass" hidden><input data-testid="dim-input" inputmode="decimal" autocomplete="off"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
